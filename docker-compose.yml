services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: pg_pwd
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  
  scraper:
    build: .
    working_dir: /app
    command: sleep infinity
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PASSWORD: pg_pwd
    restart: unless-stopped

volumes:
  db_data:
